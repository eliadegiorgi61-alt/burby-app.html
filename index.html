<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burby App</title>
<style>
  body{margin:0;font-family:Arial;background:#FFF3D6;text-align:center}
  .header{background:#FF4D2E;color:white;padding:15px;font-size:22px;font-weight:bold}
  .burby-img{width:180px;animation:salta 1s infinite alternate;cursor:pointer}
  @keyframes salta{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-15px) rotate(3deg)}}
  .fumetto{background:white;border:3px solid #222;border-radius:20px;padding:12px;margin:10px 20px;font-size:18px;display:none}
  .card{background:white;margin:12px;border-radius:16px;padding:15px;box-shadow:0 3px 10px #00000020;text-align:left}
  .card h3{text-align:center}
  .riga{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #ddd}
  .prezzo{font-weight:bold;color:#FF4D2E;font-size:18px}
  button{background:#FF4D2E;color:white;border:none;padding:8px 14px;border-radius:10px;font-size:14px}
  .punti{font-size:26px;font-weight:bold;color:#FF4D2E;text-align:center}
  .barra{height:18px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0}
  .progresso{height:100%;width:0%;background:#FFB800;transition:0.5s}
  .badge{background:#FFB800;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:bold}
  .menu-speciale{background:#FFF0B3;border:2px solid #FFB800}
</style>
</head>
<body>
  <div class="header">🦉 BURBY - Panini & Hot Dog Trailer</div>

  <img src="burby.png" class="burby-img" onclick="parla()" alt="Burby il Gufo">
  <div id="fumetto" class="fumetto">Ciao, sono Burby! Guarda il menù e scegli il tuo preferito 😉</div>
  <p>Clicca sul gufo per farlo parlare!</p>

  <div class="card">
    <h3>🎁 I TUOI PUNTI</h3>
    <div class="punti"><span id="punti">0</span> / 10 punti</div>
    <div class="barra"><div id="barra" class="progresso"></div></div>
    <div id="premio" style="text-align:center">Ti mancano 10 punti per l'hot dog gratis!</div>
  </div>

  <div class="card">
    <h3>
